version: "3.8"
services:
  app:
    container_name: event-manager-nodejs-app
    build: .
    ports:
      - "3000:3000"
    environment:
      # Essas variáveis serão utilizadas pela configuração do TypeORM no seu ormconfig.json ou AppDataSource
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=event_manager
      - PORT=3000
    depends_on:
      - mongo

  mongo:
    container_name: event-manager-nodejs-mongo
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
